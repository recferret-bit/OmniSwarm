// /etc/apt/apt.conf.d/52omniswarm-unattended-upgrades (infra/deploy/provision.sh).
// The distribution's 50unattended-upgrades keeps its security-only origins.
// Docker and Node come from their own repositories, which are not in those
// origins, so they never upgrade under a running review. Upgrade them in a
// deploy window (docs/ops/OWNER_TASKS.md, "Maintenance").
// No automatic reboot: a kernel update waits for the owner
// (/var/run/reboot-required), so a reboot never kills a running review.
Unattended-Upgrade::Automatic-Reboot "false";
Unattended-Upgrade::Remove-Unused-Dependencies "true";
Unattended-Upgrade::Remove-New-Unused-Dependencies "true";
