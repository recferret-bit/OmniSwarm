name: ci

on:
  push:
    branches: [main, 'wave/**', 'issue/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No secrets, no provider calls, no Docker-marked tests (engine/scripts/*.docker.mjs).
# Every non-engine job turns itself into a notice until its folder has a package.

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node engine/scripts/harness.mjs --self-test
      - run: npm test
      - name: Skill copies are byte-identical
        run: cmp engine/skills/security-audit/SKILL.md .claude/skills/security-audit/SKILL.md

  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run test:schemas
      - run: node --test "tools/*.test.mjs"

  intake:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: omniswarm_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/omniswarm_ci
    steps:
      - uses: actions/checkout@v4
      - name: Detect package
        id: has
        run: |
          if [ -f apps/api/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::intake: skipped (no apps/api/package.json yet)"; fi
      - if: steps.has.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: steps.has.outputs.present == 'true'
        run: npm ci
      - if: steps.has.outputs.present == 'true'
        run: npm run test:intake

  landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect package
        id: has
        run: |
          if [ -f apps/web/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::landing: skipped (no apps/web/package.json yet)"; fi
      - if: steps.has.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: steps.has.outputs.present == 'true'
        run: npm ci
      - if: steps.has.outputs.present == 'true'
        run: npm run test:landing
      - if: steps.has.outputs.present == 'true'
        run: npm run guard --workspace apps/web

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect crate
        id: has
        run: |
          if [ -f contracts/review-registry/Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::contract: skipped (no contracts/review-registry/Cargo.toml yet)"; fi
      - if: steps.has.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - if: steps.has.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: steps.has.outputs.present == 'true'
        run: npm ci
      - if: steps.has.outputs.present == 'true'
        run: npm run test:contract
      - if: steps.has.outputs.present == 'true'
        run: cargo clippy --manifest-path contracts/review-registry/Cargo.toml --all-targets -- -D warnings

  # near-workspaces against near-sandbox. A pull request runs it only when contracts/
  # changed. The sandbox binary and the cargo target/ are cached so a warm run stays
  # under 10 minutes.
  contract-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Contracts changed
        id: contracts
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^contracts/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::contract-sandbox: skipped (pull request does not touch contracts/)"
          fi
      - if: steps.contracts.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - if: steps.contracts.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: steps.contracts.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            contracts/review-registry/target
            /home/runner/.cache/omniswarm/near-sandbox
          key: contract-sandbox-v1-${{ runner.os }}-${{ hashFiles('contracts/review-registry/Cargo.lock') }}
          restore-keys: |
            contract-sandbox-v1-${{ runner.os }}-
      - if: steps.contracts.outputs.run == 'true'
        name: Cache near-sandbox 2.14.0
        run: |
          set -euo pipefail
          dest="$HOME/.cache/omniswarm/near-sandbox"
          bin="$dest/near-sandbox"
          if [ ! -x "$bin" ]; then
            mkdir -p "$dest"
            tmp="$(mktemp -d)"
            url="https://s3-us-west-1.amazonaws.com/build.nearprotocol.com/nearcore/Linux-x86_64/2.14.0/near-sandbox.tar.gz"
            curl -fsSL -o "$tmp/near-sandbox.tar.gz" "$url"
            tar -xzf "$tmp/near-sandbox.tar.gz" -C "$tmp"
            cp "$tmp/Linux-x86_64/near-sandbox" "$bin"
            chmod 755 "$bin"
            rm -rf "$tmp"
          fi
          echo "NEAR_SANDBOX_BIN_PATH=$bin" >> "$GITHUB_ENV"
      - if: steps.contracts.outputs.run == 'true'
        run: npm ci
      - if: steps.contracts.outputs.run == 'true'
        run: npm run test:contract:sandbox

  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check:w13
      - run: npm run typecheck --workspace packages/guard

  # The same gate as on a laptop: static checks (compose, env contract, nginx -t,
  # shellcheck, hadolint, systemd-analyze verify, dry runs), the api image
  # checks, and the local stack bring-up with the stub apps (loopback ports,
  # torn down after). Pinned tool images, no secrets, no host contacted.
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check:infra
