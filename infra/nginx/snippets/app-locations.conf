# App origin locations. Included by the TLS template and the local HTTP template.
# Do not set headers in here: a location header would drop the server-level ones.
set $omni_api api:8787;
set $omni_web web:3000;

client_max_body_size 16k;
# Same-host bridge network: a healthy replica accepts in well under 1 s;
# a removed one costs at most this before nginx tries the next.
proxy_connect_timeout 1s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

# The API has no admin routes on its public port. This blocks the path anyway,
# so one added by mistake is never reachable from outside.
location ^~ /api/admin {
  deny all;
}

# Server-sent events: no buffering, no gzip, long read timeout.
location ~ ^/api/requests/[^/]+/events$ {
  limit_conn omni_sse 10;
  include /etc/nginx/snippets/proxy.conf;
  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 1h;
  proxy_send_timeout 1h;
  gzip off;
  proxy_pass http://$omni_api;
}

location = /api/challenge {
  limit_req zone=omni_challenge burst=10 nodelay;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass http://$omni_api;
}

location = /api/quote {
  limit_req zone=omni_quote burst=10 nodelay;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass http://$omni_api;
}

location = /api/requests {
  limit_req zone=omni_requests burst=5 nodelay;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass http://$omni_api;
}

location /api/ {
  limit_req zone=omni_api burst=40 nodelay;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass http://$omni_api;
}

location / {
  client_max_body_size 1m;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass http://$omni_web;
}
