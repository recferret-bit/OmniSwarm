[package]
name = "review-registry"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "OmniSwarm paid review registry"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.5.0", features = ["legacy", "unit-testing"] }
borsh = "1.5"
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
