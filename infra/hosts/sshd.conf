# /etc/ssh/sshd_config.d/10-omniswarm.conf (infra/deploy/provision.sh).
# sshd keeps the first value it reads for each keyword, and Debian/Ubuntu
# include sshd_config.d/*.conf before the main file. The 10- prefix sorts
# ahead of cloud images' 50-cloud-init.conf, which may enable passwords.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
PermitEmptyPasswords no
PubkeyAuthentication yes
AuthenticationMethods publickey
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
