# /etc/systemd/journald.conf.d/omniswarm.conf (infra/deploy/provision.sh).
# The worker, the timers and sshd log to the journal. Containers log to
# Docker's json-file driver (20m x 5 per container, infra/hosts/daemon.json).
# Client addresses in sshd/fail2ban lines age out after MaxRetentionSec.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=1G
SystemKeepFree=2G
MaxRetentionSec=30day
