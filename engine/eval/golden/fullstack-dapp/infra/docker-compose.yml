services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    privileged: true
    ports:
      - "4000:4000"
      - "9229:9229"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file: production.env
    depends_on:
      - db

  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: tipjar
      POSTGRES_PASSWORD: tipjar
    ports:
      - "0.0.0.0:5432:5432"

  proxy:
    image: nginx:1.27.2@sha256:3d696e8357051647b844d8c7cf4a0aa71e84379999a4f6af9b8ca1f7919ade42
    read_only: true
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
