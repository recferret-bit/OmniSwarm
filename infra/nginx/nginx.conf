# Main config. Mounted read-only at /etc/nginx/nginx.conf. The server blocks
# live in templates/omniswarm.conf.template; the image entrypoint renders it
# (envsubst, OMNI_* names only) into /etc/nginx/conf.d/ on every start.
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  charset utf-8;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;
  client_body_timeout 15s;
  client_header_timeout 15s;
  send_timeout 30s;

  # Client addresses are logged truncated (IPv4 /24, IPv6 /48): enough to spot
  # abuse, not to identify a visitor. Rate limits still key on the full address.
  map $remote_addr $omni_log_addr {
    ~^(?<v4net>\d+\.\d+\.\d+)\.\d+$            $v4net.0;
    ~^(?<v6net>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):  $v6net::;
    default                                    -;
  }
  # Path only, never the query string. No request bodies, auth headers,
  # cookies, referrers or user agents.
  log_format omniswarm '$omni_log_addr [$time_iso8601] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent $request_time host=$host req=$request_id '
                       'upstream=$upstream_addr upstream_status=$upstream_status';
  access_log /dev/stdout omniswarm;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Docker's embedded DNS, consulted per request by the variable proxy_pass
  # targets in the template, so `compose up --scale api=N` and rolling
  # restarts change the replica set without an nginx reload.
  resolver 127.0.0.11 valid=2s ipv6=off;
  resolver_timeout 3s;

  # Edge rate limits (INTAKE.md section 5). nginx is the single edge in front
  # of every API replica, so these hold no matter how many replicas run.
  limit_req_zone $binary_remote_addr zone=omni_challenge:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=omni_quote:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=omni_requests:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=omni_api:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=omni_sse:10m;
  limit_req_status 429;
  limit_conn_status 429;
  # Rejections would otherwise log at `error` with the full client address;
  # `notice` is below error_log's `warn`, so they stay out of the logs.
  limit_req_log_level notice;
  limit_conn_log_level notice;

  include /etc/nginx/conf.d/omniswarm.conf;
}
