events {}
http {
  server {
    listen 80;
    server_name _;
    location /api/ {
      proxy_pass http://127.0.0.1:8787;
      proxy_buffering off;
    }
    location / {
      root /var/www/landing;
    }
  }
  server {
    listen 80;
    server_name reports.localhost;
    root /var/www/reports;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" always;
  }
}
