# Check-only overlay: swaps the api, migrate and web images for the stub in
# infra/test/stub so the infra bring-up (infra/check/bring-up.sh) proves nginx,
# compose, scaling, rolling restarts and backups without depending on the
# apps/ code of other tracks. `infra/check.sh --apps=real` drops this file and
# builds apps/api/Dockerfile and apps/web/Dockerfile instead.
services:
  migrate:
    # The real postgres client proves the DATABASE_URL compose hands out works.
    image: postgres:16.15-alpine3.24@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    build: !reset null
    user: "70:70"
    command:
      - sh
      - -c
      - >-
        psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -q
        -c "CREATE TABLE IF NOT EXISTS stub_request (id serial PRIMARY KEY, created_at timestamptz DEFAULT now())"
        -c "INSERT INTO stub_request DEFAULT VALUES"

  api:
    image: omniswarm-stub/app:${OMNI_RELEASE:?set OMNI_RELEASE}
    build: !override
      context: ../..
      dockerfile: infra/test/stub/Dockerfile
    command: ["exec-script", "/app", "api"]

  web:
    image: omniswarm-stub/app:${OMNI_RELEASE:?set OMNI_RELEASE}
    build: !override
      context: ../..
      dockerfile: infra/test/stub/Dockerfile
    command: ["exec-script", "/app", "web"]
    tmpfs: !override
      - /tmp:size=16m,mode=1777
