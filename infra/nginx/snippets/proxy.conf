# Shared proxy settings for the api and web upstreams. Timeouts and buffering
# are set at server level so the SSE location can override them.
proxy_http_version 1.1;
proxy_set_header Host $host;
# nginx is the edge: overwrite (never append to) the client's X-Forwarded-For,
# so a forged header cannot reach the API's trustProxy / rate keys.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
# A replica that is stopping refuses new connections; try another one.
proxy_next_upstream error timeout http_502 http_503;
proxy_next_upstream_tries 3;
proxy_next_upstream_timeout 10s;
