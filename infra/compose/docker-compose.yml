services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: omniswarm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omniswarm}
      POSTGRES_DB: omniswarm
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    image: node:24-alpine
    working_dir: /srv/omniswarm/current
    command: ["node", "apps/api/src/server.ts"]
    environment:
      DATABASE_URL: postgres://omniswarm:${POSTGRES_PASSWORD:-omniswarm}@postgres:5432/omniswarm
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret}
      NETWORK: testnet
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:8787:8787"
volumes:
  pgdata:
