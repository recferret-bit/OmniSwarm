events {}

http {
  server_tokens on;

  server {
    listen 80;
    server_name tipjar.example;

    location / {
      root /usr/share/nginx/html;
      autoindex on;
    }

    location /api/ {
      proxy_pass http://api:4000;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      add_header Access-Control-Allow-Origin * always;
    }

    location /internal/ {
      allow 10.0.0.0/8;
      deny all;
      proxy_pass http://api:4000;
    }
  }
}
