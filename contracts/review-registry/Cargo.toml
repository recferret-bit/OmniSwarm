[package]
name = "review-registry"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "OmniSwarm paid review registry"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.0"
# Only for the near-workspaces sandbox suite (tests/workspaces.rs, feature `sandbox`). Optional, so
# neither `cargo test` nor the wasm build compiles them. Host and CI only, never the review sandbox.
near-workspaces = { version = "=0.24.0", optional = true }
tokio = { version = "=1.54.1", optional = true, features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing"] }

[features]
sandbox = ["dep:near-workspaces", "dep:tokio"]

[[test]]
name = "workspaces"
required-features = ["sandbox"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
