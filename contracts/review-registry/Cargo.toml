[package]
name = "review-registry"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "OmniSwarm paid review registry"
repository = "https://github.com/recferret-bit/OmniSwarm"

# cargo-near 0.23.0 `cargo near new` template (tag cargo-near-v0.23.0).
# The image tag is descriptive; the digest identifies the build environment.
# `reproducible-wasm` clones `repository` at the committed revision inside that image.
# Uncommitted edits are not in the wasm. Cargo.lock must be committed.
# The commit must be pushed: the container clones this URL and has no credentials.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"
# Only for the near-workspaces sandbox suite (tests/workspaces.rs, feature `sandbox`). Optional, so
# neither `cargo test` nor the wasm build compiles them. Host and CI only, never the review sandbox.
near-workspaces = { version = "=0.24.0", optional = true }
tokio = { version = "=1.54.1", optional = true, features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }

[features]
sandbox = ["dep:near-workspaces", "dep:tokio"]

[[test]]
name = "workspaces"
required-features = ["sandbox"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
