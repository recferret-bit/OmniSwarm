# Included at server level only. `add_header` in a location would drop every
# inherited header, so no location in the template sets its own.
# HSTS is snippets/hsts.conf. Only the TLS servers include it. The local HTTP
# edge must not send it, or the browser would pin the host to https.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
