# Local stack only. The browser must pass nginx basic auth before the admin
# page or the provider-key API is proxied. The API checks the same header.
location ^~ /admin {
  auth_basic "OmniSwarm admin";
  auth_basic_user_file /etc/nginx/admin.htpasswd;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass http://$omni_web;
}

location ^~ /api/operator/ {
  auth_basic "OmniSwarm admin";
  auth_basic_user_file /etc/nginx/admin.htpasswd;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass http://$omni_api;
}
